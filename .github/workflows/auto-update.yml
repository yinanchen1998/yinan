name: Auto Update Chunyun Data

on:
  # 定时运行：每天 9:00, 15:00, 21:00 (北京时间)
  # 注意：GitHub Actions 使用 UTC 时间，北京时间 = UTC+8
  # 由于实际运行会有延迟，提前 1 小时设置
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 ≈ 北京时间 8:00 (实际约 9:00 运行)
    - cron: '0 6 * * *'   # UTC 06:00 ≈ 北京时间 14:00 (实际约 15:00 运行)
    - cron: '0 12 * * *'  # UTC 12:00 ≈ 北京时间 20:00 (实际约 21:00 运行)
  
  # 手动触发
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
          
      - name: Update Chunyun Data
        run: |
          python scripts/update_chunyun_data.py
          
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet src/utils/chunyunData.ts; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No data changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Data changes detected"
          fi
          
      - name: Commit changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/utils/chunyunData.ts
          git commit -m "Auto-update: 2026 Chunyun data $(date +'%Y-%m-%d %H:%M')"
          git push
          
      - name: Trigger Netlify Deploy
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          curl -X POST -d '{}' ${{ secrets.NETLIFY_BUILD_HOOK }}
          echo "🚀 Triggered Netlify deploy"
